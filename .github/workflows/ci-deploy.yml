name: CI and production deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qvaapply-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache-dependency-path: services/go.work

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm check

      - name: Parity gate (F0)
        run: pnpm parity:gate
        env:
          PARITY_REPORT_DIR: ${{ runner.temp }}/parity

      - name: Verify Go workspace (F1)
        run: bash services/scripts/verify.sh

      - name: Go static analysis and vulnerabilities (F1)
        run: bash services/scripts/lint.sh

  postgres-f1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache-dependency-path: services/go.work

      - name: Verify Postgres schema and triggers
        run: |
          bash services/db/test-postgres.sh
          bash services/db/test-postgres-import.sh
          bash services/db/test-postgres-go.sh
          bash services/f2/recovery-kill9.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGADMIN_DB: postgres

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, postgres-f1]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: qvaapply-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build deployment archive
        run: >-
          tar --create --gzip
          --file "qvaapply-${GITHUB_SHA}.tar.gz"
          package.json pnpm-lock.yaml dist public deploy
          scripts/deploy-vps.sh scripts/cleanup-vps.sh scripts/backup-vps.sh scripts/enable-vps-tls.sh
          scripts/report-hunting-latency.mjs

      - name: Configure production SSH
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy production release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh_port="${VPS_SSH_PORT:-22}"
          remote="${VPS_USER}@${VPS_HOST}"
          archive="qvaapply-${GITHUB_SHA}.tar.gz"
          remote_root="/opt/qvaapply"
          ssh_options=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$ssh_port")
          ssh "${ssh_options[@]}" "$remote" "install -d -m 700 '$remote_root/uploads'"
          scp -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -P "$ssh_port" "$archive" "$remote:$remote_root/uploads/$archive"
          ssh "${ssh_options[@]}" "$remote" \
            "set -eu
             task_tmp=\$(mktemp -d '$remote_root/deploy-script.XXXXXX')
             trap 'rm -rf -- \"\$task_tmp\"' EXIT
             tar -xzf '$remote_root/uploads/$archive' -C \"\$task_tmp\" scripts/deploy-vps.sh
             bash \"\$task_tmp/scripts/deploy-vps.sh\" '$remote_root/uploads/$archive' '$GITHUB_SHA'"
