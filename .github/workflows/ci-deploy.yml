name: CI and production deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qvaapply-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: qvaapply-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build deployment archive
        run: >-
          tar --create --gzip
          --file "qvaapply-${GITHUB_SHA}.tar.gz"
          package.json pnpm-lock.yaml dist public deploy
          scripts/deploy-vps.sh scripts/cleanup-vps.sh scripts/backup-vps.sh scripts/enable-vps-tls.sh

      - name: Configure production SSH
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy production release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh_port="${VPS_SSH_PORT:-22}"
          remote="${VPS_USER}@${VPS_HOST}"
          archive="qvaapply-${GITHUB_SHA}.tar.gz"
          remote_root="/opt/qvaapply"
          ssh_options=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$ssh_port")
          ssh "${ssh_options[@]}" "$remote" "install -d -m 700 '$remote_root/uploads'"
          scp -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -P "$ssh_port" "$archive" "$remote:$remote_root/uploads/$archive"
          ssh "${ssh_options[@]}" "$remote" \
            "set -eu
             task_tmp=\$(mktemp -d '$remote_root/deploy-script.XXXXXX')
             trap 'rm -rf -- \"\$task_tmp\"' EXIT
             tar -xzf '$remote_root/uploads/$archive' -C \"\$task_tmp\" scripts/deploy-vps.sh
             bash \"\$task_tmp/scripts/deploy-vps.sh\" '$remote_root/uploads/$archive' '$GITHUB_SHA'"
