name: Android SMS APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test and build debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload private-installation APK
        uses: actions/upload-artifact@v4
        with:
          name: qvaapply-sms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare private release signing
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          QVAAPPLY_ANDROID_KEYSTORE_BASE64: ${{ secrets.QVAAPPLY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$QVAAPPLY_ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$QVAAPPLY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qvaapply-release.jks"

      - name: Build signed private release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          QVAAPPLY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/qvaapply-release.jks
          QVAAPPLY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QVAAPPLY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$QVAAPPLY_ANDROID_KEYSTORE_PASSWORD"
          gradle --no-daemon :app:assembleRelease

      - name: Upload signed private release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: qvaapply-sms-private-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
