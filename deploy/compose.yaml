name: qvaapply-adriano

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: qvaapply-adriano:${QVAAPPLY_REVISION:?Falta QVAAPPLY_REVISION}
    container_name: qvaapply-adriano
    restart: unless-stopped
    env_file:
      - /root/Adriano/QvaApply/config/env
    environment:
      DATA_DIR: /app/data
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 3000
    ports:
      - "127.0.0.1:${QVAAPPLY_HOST_PORT:?Falta QVAAPPLY_HOST_PORT}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /root/Adriano/QvaApply/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
